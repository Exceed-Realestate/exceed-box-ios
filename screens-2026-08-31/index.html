<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exceed Box — All Screens</title>
<style>
  :root{--charcoal:#15171c;--card:#1c1f26;--yellow:#ffd84d;--grey:#8b8f99;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--charcoal);color:#fff;font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  header{padding:40px 40px 24px;border-bottom:1px solid #2a2e37}
  h1{margin:0 0 6px;font-size:34px;letter-spacing:-.02em}
  h1 span{color:var(--yellow)}
  .sub{color:var(--grey);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:28px;padding:32px 40px 80px}
  figure{margin:0;background:var(--card);border:1px solid #2a2e37;border-radius:12px;overflow:hidden}
  figure img{display:block;width:100%;height:auto;cursor:zoom-in}
  figcaption{padding:12px 16px;display:flex;align-items:baseline;gap:10px}
  .n{color:var(--yellow);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
  .t{font-weight:600}
  .f{margin-left:auto;color:var(--grey);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  dialog{border:0;background:transparent;max-width:96vw;max-height:96vh;padding:0}
  dialog::backdrop{background:rgba(0,0,0,.88)}
  dialog img{max-width:96vw;max-height:96vh;width:auto;height:auto;border-radius:8px}
</style>
</head>
<body>
<header>
  <h1>EXCEED <span>BOX</span> — all screens</h1>
  <div class="sub">exceed-box-ios · signed in as admin (Teruo Yamashita) · demo/mock data · 1440×900 regular width · captured 2026-08-31</div>
</header>
<div class="grid" id="g"></div>
<dialog id="lb"><img id="lbi" alt=""></dialog>
<script>
const S=[
 ["01-Login.png","Login"],
 ["02-Today.png","Today"],
 ["03-Leads.png","Leads + Lead detail"],
 ["04-Pipeline.png","Pipeline"],
 ["05-Tracking.png","Tracking"],
 ["06-Dashboard.png","Dashboard"],
 ["07-Team.png","Team"],
 ["08-Nurture.png","Nurture + Sequence detail"],
 ["09-SNS.png","SNS"],
 ["10-Booking.png","Booking"],
 ["11-Assign.png","Assign"],
 ["12-Integrations.png","Integrations"],
 ["13-Admin.png","Admin / Users"],
 ["14-Settings.png","Notification settings"],
 ["15-CardScan.png","Card scan (AI-OCR)"],
 ["16-Import.png","CSV import"],
 ["17-MemberTasks.png","Member tasks"],
];
const g=document.getElementById('g'),lb=document.getElementById('lb'),lbi=document.getElementById('lbi');
S.forEach(([f,t],i)=>{
  const fig=document.createElement('figure');
  fig.innerHTML=`<img src="${f}" alt="${t}" loading="lazy">
    <figcaption><span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${t}</span><span class="f">${f}</span></figcaption>`;
  fig.querySelector('img').onclick=()=>{lbi.src=f;lb.showModal();};
  g.appendChild(fig);
});
lb.onclick=()=>lb.close();
</script>
</body>
</html>
